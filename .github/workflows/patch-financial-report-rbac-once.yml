name: Patch financial report RBAC once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-financial-report-rbac-once.yml

permissions:
  contents: write

jobs:
  patch-financial-report-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Restrict financial controls and COGS posting authority
        shell: python
        run: |
          from pathlib import Path

          p=Path('routes/financial-controls-intelligence.js')
          s=p.read_text()
          old="router.use(requirePermission('reports'));"
          new="// Collections, commitments, receivables, inventory capital and finalized payroll are financial-report data.\nrouter.use(requirePermission('reports_financial'));"
          if s.count(old)!=1: raise SystemExit(f'Expected one financial-controls report guard, found {s.count(old)}')
          p.write_text(s.replace(old,new))

          p=Path('routes/accounting-retail-cogs-sync.js')
          s=p.read_text()
          old="const {requireAnyPermission}=require('../lib/permissions');"
          new="const {requirePermission}=require('../lib/permissions');"
          if s.count(old)!=1: raise SystemExit(f'Expected one retail COGS permission import, found {s.count(old)}')
          s=s.replace(old,new)
          old="router.post('/sync',requireAnyPermission('reports_financial','reports'),async(req,res,next)=>{"
          new="router.post('/sync',requirePermission('reports_financial'),async(req,res,next)=>{"
          if s.count(old)!=1: raise SystemExit(f'Expected one broad retail COGS posting guard, found {s.count(old)}')
          p.write_text(s.replace(old,new))
      - name: Verify financial RBAC patch
        run: |
          node --check routes/financial-controls-intelligence.js
          node --check routes/accounting-retail-cogs-sync.js
          grep -F "router.use(requirePermission('reports_financial'))" routes/financial-controls-intelligence.js
          grep -F "router.post('/sync',requirePermission('reports_financial')" routes/accounting-retail-cogs-sync.js
          git diff --check
          git diff -- routes/financial-controls-intelligence.js routes/accounting-retail-cogs-sync.js
      - name: Commit financial reporting authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/financial-controls-intelligence.js routes/accounting-retail-cogs-sync.js
          git commit -m "Restrict financial reporting and COGS posting authority"
          git push origin HEAD:security/pos-hardening-v1
