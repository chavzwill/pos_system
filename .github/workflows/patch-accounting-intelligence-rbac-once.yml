name: Patch accounting intelligence RBAC once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-accounting-intelligence-rbac-once.yml

permissions:
  contents: write

jobs:
  patch-accounting-intelligence-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Restrict accounting intelligence to financial reports
        shell: python
        run: |
          from pathlib import Path
          p=Path('routes/accounting-intelligence.js')
          s=p.read_text()
          old="router.use(requirePermission('reports'));"
          new="// Revenue, margin, COGS and receivables are financial-report data, not general operational reports.\nrouter.use(requirePermission('reports_financial'));"
          if s.count(old)!=1: raise SystemExit(f'Expected one broad accounting intelligence guard, found {s.count(old)}')
          p.write_text(s.replace(old,new))
      - name: Verify accounting intelligence RBAC patch
        run: |
          node --check routes/accounting-intelligence.js
          grep -F "router.use(requirePermission('reports_financial'))" routes/accounting-intelligence.js
          ! grep -F "router.use(requirePermission('reports'))" routes/accounting-intelligence.js
          git diff --check
          git diff -- routes/accounting-intelligence.js
      - name: Commit financial intelligence authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/accounting-intelligence.js
          git commit -m "Restrict accounting intelligence to financial reports"
          git push origin HEAD:security/pos-hardening-v1
