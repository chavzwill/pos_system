name: POS Security Hardening Certification

on:
  push:
    branches:
      - security/pos-hardening-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POS_TEST_USER: admin
      POS_TEST_PASSWORD: 'CI-Test-Auth!2026'
      POS_TEST_PIN: '864209'
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      CI: '1'
    steps:
      - name: Checkout hardened head
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate hardened security module syntax
        run: |
          node --check lib/securityHardening.js
          node --check lib/securityAudit.js
          node --check lib/apiKeyAuth.js
          node --check lib/sessionAuth.js
          node --check lib/passwordPolicy.js
          node --check lib/permissions.js
          node --check routes/employees.js
          node --check routes/security-groups.js
          node --check routes/settings.js
          node --check routes/api-keys.js
          node --check routes/woocommerce.js
          node --check routes/accounting-intelligence.js
          node --check routes/financial-controls-intelligence.js
          node --check routes/accounting-source-sync.js
          node --check routes/accounting-retail-cogs-sync.js
          node --check public/security-permission-extension.js
          node --check public/settings-workspace.js
          node --check public/integration-admin-workspace.js
          node --check scripts/production-credential-preflight.js
          node --check scripts/certify-production-credential-bootstrap.js
          node --check scripts/production-account-recovery.js
          node --check scripts/certify-production-account-recovery.js
          node --check server.js
      - name: Certify production credential bootstrap
        run: node scripts/certify-production-credential-bootstrap.js
      - name: Certify production administrator recovery
        run: node scripts/certify-production-account-recovery.js
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Bootstrap isolated local runtime database
        run: |
          rm -f pos.db pos.db-shm pos.db-wal
          node scripts/ci-runtime-bootstrap.js
      - name: Run full release gate with adversarial security tests
        run: npm run test:release-gate -- --workers=1
      - name: Certify inherited security assignment boundaries
        run: npx playwright test tests/security-assignment-boundaries.spec.js --workers=1
      - name: Certify atomic security governance evidence
        run: npx playwright test tests/security-governance-atomicity.spec.js --workers=1
      - name: Certify known API key denial audit evidence
        run: npx playwright test tests/api-key-audit.spec.js --workers=1
      - name: Certify API key lifecycle governance
        run: npx playwright test tests/api-key-governance.spec.js --workers=1
      - name: Certify forced first-login password boundary
        run: npx playwright test tests/forced-password-change.spec.js --workers=1
      - name: Certify password reset and recovery runtime boundary
        run: npx playwright test tests/password-reset-security.spec.js --workers=1
      - name: Certify settings and integration-secret governance
        run: npx playwright test tests/settings-security-governance.spec.js --workers=1
      - name: Certify WooCommerce credential governance
        run: npx playwright test tests/woocommerce-secret-governance.spec.js --workers=1
      - name: Certify explicit integration settings UI authority
        run: npx playwright test tests/settings-permission-ui.spec.js --workers=1
      - name: Certify accounting source sync financial authority
        run: npx playwright test tests/accounting-source-sync-rbac.spec.js --workers=1
      - name: Certify PIN hashing and legacy migration
        run: npx playwright test tests/pin-security-runtime.spec.js --workers=1
      - name: Certify request abuse controls
        run: npx playwright test tests/request-abuse-security.spec.js --workers=1
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-hardening-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
