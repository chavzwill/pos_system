name: Patch password audit ordering once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-password-audit-ordering-once.yml

permissions:
  contents: write

jobs:
  patch-password-audit-ordering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Initialize audit schema before credential transactions
        shell: python
        run: |
          from pathlib import Path
          path=Path('routes/employees.js')
          source=path.read_text()

          old_import="const { recordSecurityAudit } = require('../lib/securityAudit');"
          new_import="const { ensureSecurityAuditTable, recordSecurityAudit } = require('../lib/securityAudit');"
          if source.count(old_import) != 1:
            raise SystemExit(f'Expected one audit import, found {source.count(old_import)}')
          source=source.replace(old_import,new_import)

          self_anchor="    const hash = await bcrypt.hash(password, PASSWORD_COST);\n    const tx = await db.transaction('write');"
          self_replacement="    await ensureSecurityAuditTable();\n    const hash = await bcrypt.hash(password, PASSWORD_COST);\n    const tx = await db.transaction('write');"
          if source.count(self_anchor) != 1:
            raise SystemExit(f'Expected one self-change transaction anchor, found {source.count(self_anchor)}')
          source=source.replace(self_anchor,self_replacement)

          reset_anchor="    const hash = await bcrypt.hash(temporary_password, PASSWORD_COST);\n    const tx = await db.transaction('write');"
          reset_replacement="    await ensureSecurityAuditTable();\n    const hash = await bcrypt.hash(temporary_password, PASSWORD_COST);\n    const tx = await db.transaction('write');"
          if source.count(reset_anchor) != 1:
            raise SystemExit(f'Expected one reset transaction anchor, found {source.count(reset_anchor)}')
          source=source.replace(reset_anchor,reset_replacement)

          path.write_text(source)
      - name: Verify audit ordering patch
        run: |
          node --check routes/employees.js
          test "$(grep -c 'await ensureSecurityAuditTable();' routes/employees.js)" -eq 2
          git diff --check
          git diff -- routes/employees.js
      - name: Commit credential audit ordering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/employees.js
          git commit -m "Initialize credential audit schema before transactions"
          git push origin HEAD:security/pos-hardening-v1
