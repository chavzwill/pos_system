name: Gate 1 Stock Movement Authority

on:
  workflow_dispatch:
  push:
    branches:
      - 'gate1/stock-movement-authority'
  pull_request:
    paths:
      - 'routes/inventory-adjustment-hardening.js'
      - 'routes/inventory-adjustment-hardening-base.js'
      - 'routes/product-stock-authority.js'
      - 'tests/gate1-stock-movement-authority.spec.js'
      - '.github/workflows/gate1-stock-movement-authority.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POS_TEST_USER: admin
      POS_TEST_PASSWORD: '123456'
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate isolated CI encryption key
        shell: bash
        run: |
          key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64'))")"
          printf 'POS_SETTINGS_ENCRYPTION_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Bootstrap isolated runtime database
        run: |
          rm -f pos.db pos.db-shm pos.db-wal
          node scripts/ci-runtime-bootstrap.js
      - name: Validate stock authority syntax
        run: |
          node --check routes/inventory-adjustment-hardening.js
          node --check routes/inventory-adjustment-hardening-base.js
          node --check routes/product-stock-authority.js
      - name: Run stock movement authority proof
        run: npx playwright test tests/gate1-stock-movement-authority.spec.js --workers=1
