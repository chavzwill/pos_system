name: Remove legacy bootstrap credentials once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/remove-legacy-bootstrap-credentials-once.yml

permissions:
  contents: write

jobs:
  patch-legacy-credential-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardened branch
        uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0

      - name: Remove known bootstrap credentials
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('database.js')
          source = path.read_text()

          repair_pattern = re.compile(
              r"  // Ensure admin always has a password — runs unconditionally on every boot\n"
              r"  \{\n"
              r"    const \{ rows: \[adminEmp\] \} = await db\.execute\(\{ sql: 'SELECT id, password FROM employees WHERE username = \?', args: \['admin'\] \}\);\n"
              r"    if \(adminEmp && !adminEmp\.password\) \{\n"
              r"      await db\.execute\(\{ sql: \"UPDATE employees SET password='123456', must_change_password=1 WHERE username='admin'\", args: \[\] \}\);\n"
              r"    \}\n"
              r"  \}\n\n"
          )
          source, repair_count = repair_pattern.subn(
              "  // Credentials are never manufactured during database initialization. A fresh\n"
              "  // installation remains locked until the explicit production credential\n"
              "  // preflight provisions the administrator, or a test/dev bootstrap does so.\n\n",
              source,
          )
          if repair_count != 1:
              raise SystemExit(f'Expected exactly one legacy admin repair block, found {repair_count}')

          seed_pattern = re.compile(
              r"    // Employees — admin seeded with default password so first login works immediately\n"
              r"    const eSql = 'INSERT INTO employees \(employee_number,first_name,last_name,username,pin,password,must_change_password,role\) VALUES \(\?,\?,\?,\?,\?,\?,\?,\?\)';\n"
              r"    await db\.execute\(\{ sql: eSql, args: \['EMP-0001','Admin','User','admin','1234','123456',1,'admin'\] \}\);\n"
              r"    await db\.execute\(\{ sql: eSql, args: \['EMP-0002','Jane','Doe','jdoe','5678',null,0,'cashier'\] \}\);\n"
              r"    await db\.execute\(\{ sql: eSql, args: \['EMP-0003','Bob','Smith','bsmith','9012',null,0,'cashier'\] \}\);\n"
          )
          source, seed_count = seed_pattern.subn(
              "    // Fresh/demo identities are deliberately credential-locked. !LOCKED! is not a\n"
              "    // syntactically valid PIN and cannot authenticate through routes/employees.js.\n"
              "    // Production must provision the administrator through the credential preflight;\n"
              "    // CI/dev bootstraps may replace these locked values with bcrypt hashes explicitly.\n"
              "    const eSql = 'INSERT INTO employees (employee_number,first_name,last_name,username,pin,password,must_change_password,role) VALUES (?,?,?,?,?,?,?,?)';\n"
              "    const lockedCredential = '!LOCKED!';\n"
              "    await db.execute({ sql: eSql, args: ['EMP-0001','Admin','User','admin',lockedCredential,null,1,'admin'] });\n"
              "    await db.execute({ sql: eSql, args: ['EMP-0002','Jane','Doe','jdoe',lockedCredential,null,1,'cashier'] });\n"
              "    await db.execute({ sql: eSql, args: ['EMP-0003','Bob','Smith','bsmith',lockedCredential,null,1,'cashier'] });\n",
              source,
          )
          if seed_count != 1:
              raise SystemExit(f'Expected exactly one legacy employee credential seed block, found {seed_count}')

          path.write_text(source)

      - name: Verify patch is narrowly scoped
        run: |
          node --check database.js
          ! grep -F "password='123456'" database.js
          ! grep -F "'admin','1234','123456'" database.js
          git diff --check
          git diff -- database.js

      - name: Commit credential seed hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.js
          git commit -m "Remove legacy plaintext bootstrap credentials"
          git push origin HEAD:security/pos-hardening-v1
