name: Patch settings workspace permissions once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-settings-workspace-permissions-once.yml

permissions:
  contents: write

jobs:
  patch-settings-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Align settings UI with server permissions
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/settings-workspace.js')
          s=p.read_text()

          replacements=[
            ("const state={open:false,values:{},secrets:new Set(),tab:'company',saving:false};",
             "const state={open:false,values:{},secrets:new Set(),capabilities:{},tab:'company',saving:false};"),
            ("state.values=data.values||{};state.secrets=new Set(data.secret_keys||[]);render();",
             "state.values=data.values||{};state.secrets=new Set(data.secret_keys||[]);state.capabilities=data.capabilities||{};const tabs=availableTabs();if(!tabs.some(([k])=>k===state.tab))state.tab=tabs[0]?.[0]||'company';render();"),
            ("function company(){return `<div class=\"tt-settings__grid\">${field('Store / company name','store_name')}${field('Phone','store_phone')}${field('Email','store_email','email')}${field('Address','store_address')}${field('Currency','currency')}${field('Default tax rate (%)','tax_rate','number')}${field('Receipt footer','receipt_footer')}</div>`;}",
             "function company(){const c=state.capabilities||{};const companyFields=c.company?`${field('Store / company name','store_name')}${field('Phone','store_phone')}${field('Email','store_email','email')}${field('Address','store_address')}${field('Currency','currency')}${field('Receipt footer','receipt_footer')}`:'';const taxFields=c.tax?field('Default tax rate (%)','tax_rate','number'):'';return `<div class=\"tt-settings__grid\">${companyFields}${taxFields}</div>`;}"),
            ("function email(){return `<div class=\"tt-settings__notice\">SMTP credentials are masked after save. Leaving a masked password unchanged keeps the current secret.</div><div class=\"tt-settings__grid\">${field('SMTP host','email_smtp_host')}${field('SMTP port','email_smtp_port','number')}${toggle('Secure SMTP','email_smtp_secure','Enable for implicit TLS providers.')}${field('SMTP username','email_smtp_user')}${field('SMTP password','email_smtp_pass')}${field('From address','email_from','email')}</div>`;}",
             "function reasonField(){return `<label class=\"tt-settings__field\"><span>Change reason</span><input name=\"_reason\" type=\"text\" minlength=\"8\" required autocomplete=\"off\"><small>Required for integration or credential changes and recorded in the security audit.</small></label>`;}function email(){return `<div class=\"tt-settings__notice\">SMTP credentials are masked after save. Leaving a masked password unchanged keeps the current secret.</div><div class=\"tt-settings__grid\">${field('SMTP host','email_smtp_host')}${field('SMTP port','email_smtp_port','number')}${toggle('Secure SMTP','email_smtp_secure','Enable for implicit TLS providers.')}${field('SMTP username','email_smtp_user')}${field('SMTP password','email_smtp_pass')}${field('From address','email_from','email')}${reasonField()}</div>`;}"),
            ("function notifications(){return `<div class=\"tt-settings__notice\">Channel enablement and provider readiness are separate. A channel can be enabled but remain unavailable until its provider endpoint or SMTP configuration is valid.</div><div class=\"tt-settings__stack\">${toggle('Repair email notifications','repair_notify_email_enabled')}${toggle('Repair SMS notifications','repair_notify_sms_enabled')}${toggle('Repair WhatsApp notifications','repair_notify_whatsapp_enabled')}</div><div class=\"tt-settings__grid\">${field('SMS provider webhook URL','repair_notify_sms_webhook_url','url')}${field('SMS provider token','repair_notify_sms_webhook_token')}${field('WhatsApp provider webhook URL','repair_notify_whatsapp_webhook_url','url')}${field('WhatsApp provider token','repair_notify_whatsapp_webhook_token')}</div>`;}",
             "function notifications(){return `<div class=\"tt-settings__notice\">Channel enablement and provider readiness are separate. A channel can be enabled but remain unavailable until its provider endpoint or SMTP configuration is valid.</div><div class=\"tt-settings__stack\">${toggle('Repair email notifications','repair_notify_email_enabled')}${toggle('Repair SMS notifications','repair_notify_sms_enabled')}${toggle('Repair WhatsApp notifications','repair_notify_whatsapp_enabled')}</div><div class=\"tt-settings__grid\">${field('SMS provider webhook URL','repair_notify_sms_webhook_url','url')}${field('SMS provider token','repair_notify_sms_webhook_token')}${field('WhatsApp provider webhook URL','repair_notify_whatsapp_webhook_url','url')}${field('WhatsApp provider token','repair_notify_whatsapp_webhook_token')}${reasonField()}</div>`;}"),
            ("function integrations(){return `<div class=\"tt-settings__grid\">${field('WooCommerce sync interval (minutes)','woo_sync_interval','number','Use 0 to disable in-process automatic sync where supported.')}</div><div class=\"tt-settings__notice\">Provider credentials not listed here remain managed by environment configuration or their dedicated integration screens. This workspace intentionally avoids becoming a generic secret editor.</div>`;}",
             "function integrations(){return `<div class=\"tt-settings__grid\">${field('WooCommerce sync interval (minutes)','woo_sync_interval','number','Use 0 to disable in-process automatic sync where supported.')}${reasonField()}</div><div class=\"tt-settings__notice\">Provider credentials not listed here remain managed by environment configuration or their dedicated integration screens. This workspace intentionally avoids becoming a generic secret editor.</div>`;}"),
            ("function body(){return state.tab==='company'?company():state.tab==='email'?email():state.tab==='notifications'?notifications():integrations();}",
             "function availableTabs(){const c=state.capabilities||{};const tabs=[];if(c.company||c.tax)tabs.push(['company','Company']);if(c.integrations){tabs.push(['email','Email'],['notifications','Repair notifications'],['integrations','Integrations']);}return tabs;}function body(){return state.tab==='company'?company():state.tab==='email'?email():state.tab==='notifications'?notifications():integrations();}"),
            ("<nav>${[['company','Company'],['email','Email'],['notifications','Repair notifications'],['integrations','Integrations']].map(([k,l])=>`<button data-tab=\"${k}\" class=\"${state.tab===k?'is-active':''}\">${l}</button>`).join('')}</nav>",
             "<nav>${availableTabs().map(([k,l])=>`<button data-tab=\"${k}\" class=\"${state.tab===k?'is-active':''}\">${l}</button>`).join('')}</nav>"),
            ("state.values=data.values||{};state.secrets=new Set(data.secret_keys||[]);state.saving=false;render();",
             "state.values=data.values||{};state.secrets=new Set(data.secret_keys||[]);state.capabilities=data.capabilities||state.capabilities||{};state.saving=false;render();"),
          ]
          for old,new in replacements:
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'Expected one settings workspace boundary, found {count}: {old[:100]}')
            s=s.replace(old,new)
          p.write_text(s)
      - name: Verify settings UI patch
        run: |
          node --check public/settings-workspace.js
          grep -F 'function availableTabs()' public/settings-workspace.js
          grep -F 'name="_reason"' public/settings-workspace.js
          git diff --check
          git diff -- public/settings-workspace.js
      - name: Commit settings workspace permissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/settings-workspace.js
          git commit -m "Align settings workspace with permission boundaries"
          git push origin HEAD:security/pos-hardening-v1
