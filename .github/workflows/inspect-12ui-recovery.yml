name: Publish Design Image Evidence
on:
  push:
    branches: [redesign/total-tools-frontend]
    paths: ['.github/workflows/inspect-12ui-recovery.yml']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/total-tools-frontend
          fetch-depth: 0
      - name: Prepare image inspection transport
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='docs/ui-design/evidence/download-existing-candidate-images-assets/candidates';
          const out='docs/ui-design/evidence/image-transport';
          fs.mkdirSync(out,{recursive:true});
          const index={};
          for(const slot of ['A','B','C','D']){
            const bytes=fs.readFileSync(path.join(dir,slot+'.png')).toString('base64');
            const parts=[];for(let i=0;i<bytes.length;i+=100000){const name=slot+'-'+parts.length+'.txt';fs.writeFileSync(path.join(out,name),bytes.slice(i,i+100000));parts.push(name);}index[slot]=parts;
          }
          fs.writeFileSync(path.join(out,'index.json'),JSON.stringify(index));
          const diagnostic='docs/ui-design/evidence/cli-recovery-source.txt';if(fs.existsSync(diagnostic))fs.unlinkSync(diagnostic);
          NODE
          git config user.name "Total Tools Design CI"
          git config user.email "design-ci@users.noreply.github.com"
          git add docs/ui-design/evidence
          git commit -m "docs(ui): make verified design candidates inspectable [skip ci]"
          git pull --rebase origin redesign/total-tools-frontend
          git push origin HEAD:redesign/total-tools-frontend
