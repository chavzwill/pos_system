name: Purchase Receive Remediation
on:
  push:
    branches: [gate1/purchase-receive-idempotency]
permissions:
  contents: write
jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[purchase-receive-remediation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Patch integration points
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replace(file,before,after){const s=fs.readFileSync(file,'utf8');if(!s.includes(before))throw new Error(`anchor missing: ${file}`);fs.writeFileSync(file,s.replace(before,after));}
          replace('server.js',
            "app.use('/api/purchase-orders', require('./routes/purchase-order-document-context'));\napp.use('/api/purchase-orders', require('./routes/purchase-receipt-traceability'));",
            "app.use('/api/purchase-orders', require('./routes/purchase-order-document-context'));\napp.use('/api/purchase-orders', require('./routes/purchase-receive-operation-guard'));\napp.use('/api/purchase-orders', require('./routes/purchase-receipt-traceability'));"
          );
          replace('public/purchasing-workspace.js',
            "if(a==='receive'){const items=[...root().querySelectorAll('[data-receive]')].map(i=>({item_id:Number(i.dataset.receive),quantity_received:Number(i.value||0)})).filter(i=>i.quantity_received>0);if(!items.length)return alert('Enter at least one quantity received.');if(!confirm('Post these received quantities into inventory?'))return;await api(`/api/purchase-orders/${x.id}/receive`,{method:'PATCH',body:JSON.stringify({items})})}",
            "if(a==='receive'){const items=[...root().querySelectorAll('[data-receive]')].map(i=>({item_id:Number(i.dataset.receive),quantity_received:Number(i.value||0)})).filter(i=>i.quantity_received>0);if(!items.length)return alert('Enter at least one quantity received.');if(!confirm('Post these received quantities into inventory?'))return;const fingerprint=JSON.stringify(items.slice().sort((m,n)=>m.item_id-n.item_id));const storageKey=`tt-po-receive:${x.id}:${fingerprint}`;let operationKey='';try{operationKey=sessionStorage.getItem(storageKey)||''}catch(_){}if(!operationKey)operationKey=(globalThis.crypto?.randomUUID?.()||`po-${x.id}-${Date.now()}-${Math.random().toString(36).slice(2)}`);try{sessionStorage.setItem(storageKey,operationKey)}catch(_){}await api(`/api/purchase-orders/${x.id}/receive`,{method:'PATCH',headers:{'Content-Type':'application/json','Idempotency-Key':operationKey},body:JSON.stringify({items})});try{sessionStorage.removeItem(storageKey)}catch(_){}}"
          );
          replace('tests/purchase-order-hardening.spec.js',
            "async function api(cookie, method, path, body) {\n  const r = await fetch(`${BASE}${path}`, {\n    method, headers: { Cookie: cookie, 'Content-Type': 'application/json' },",
            "async function api(cookie, method, path, body) {\n  const receiveKey = method === 'PATCH' && /\\/api\\/purchase-orders\\/\\d+\\/receive$/.test(path) ? `legacy-test-${Date.now()}-${Math.random().toString(36).slice(2)}` : null;\n  const r = await fetch(`${BASE}${path}`, {\n    method, headers: { Cookie: cookie, 'Content-Type': 'application/json', ...(receiveKey ? {'Idempotency-Key':receiveKey} : {}) },"
          );
          NODE
      - name: Validate syntax
        run: |
          node --check routes/purchase-receive-operation-guard.js
          node --check public/purchasing-workspace.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/purchasing-workspace.js tests/purchase-order-hardening.spec.js
          git commit -m 'Integrate purchase receive idempotency guard [purchase-receive-remediation]'
          git push
