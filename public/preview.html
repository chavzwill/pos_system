<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Total Tools POS — Upgrade Preview</title><style>:root{--g:#0d5c4e;--g2:#0a463c;--bg:#f4f6f4;--card:#fff;--line:#dfe6e2;--text:#17211f;--muted:#6f7a75}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{min-height:100dvh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(180deg,var(--g),var(--g2));color:#fff;padding:20px 14px;display:flex;flex-direction:column}.brand{padding:5px 8px 20px;border-bottom:1px solid #ffffff24}.brand b{display:block;font-size:17px}.brand span{font-size:11px;opacity:.7}.nav{padding:14px 0;display:grid;gap:4px}.nav button{appearance:none;border:0;background:transparent;color:#ffffffc9;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff17;color:#fff}.side footer{margin-top:auto;padding:12px 8px;font-size:11px;opacity:.7}.main{min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top strong{font-size:15px}.top span{font-size:11px;color:var(--muted)}.content{padding:24px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--g)}h1{font-size:30px;margin:5px 0 5px}.hero p{margin:0;color:var(--muted);max-width:760px}.pill{padding:7px 10px;border-radius:999px;background:#eaf4ef;color:var(--g);font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.card strong{display:block;font-size:17px;margin-top:7px}.card p{font-size:12px;color:var(--muted);line-height:1.5;margin:7px 0 0}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title div small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.section-title div strong{font-size:15px}.queue{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}.row div{display:grid;gap:3px}.row small{font-size:10px;color:var(--muted)}.row b{font-size:10px;color:var(--g);background:#edf6f2;padding:5px 7px;border-radius:999px;align-self:start}.callout{background:linear-gradient(160deg,#0d5c4e,#123f37);color:#fff;border:0}.callout p{color:#d7e8e1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;color:var(--text)}.note{margin-top:18px;font-size:11px;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:16px}.top{padding:0 16px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}h1{font-size:25px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{display:block}.pill{display:inline-block;margin-top:10px}.row{align-items:flex-start}}</style></head><body><div class="app"><aside class="side"><div class="brand"><b>Total Tools Operations</b><span>Role-aware POS + Repair OS</span></div><div class="nav" id="nav"></div><footer>Visual upgrade preview — no fabricated operational data</footer></aside><main class="main"><div class="top"><strong id="topTitle">Management Workspace</strong><span>Preview branch · feature/total-tools-pos-upgrades</span></div><div class="content" id="content"></div></main></div><script>const roles={management:{title:'Management Workspace',eyebrow:'Cross-company command layer',desc:'Company-wide operations without forcing frontline employees into an admin-style interface.',cards:[['Company command','Cross-functional oversight'],['Accounting intelligence','Traceable financial exceptions'],['Inventory intelligence','Stock health and capital exposure'],['Dispatch intelligence','Movement, risk and fulfillment']],rows:[['Exceptions requiring review','Operational, financial and inventory signals','Review'],['Branch performance','Role-appropriate cross-branch visibility','Monitor'],['System controls','RBAC, auditability and governed overrides','Controlled']],actions:['Accounting Intelligence','Inventory Intelligence','Operational Reports','Employees & Security']},service:{title:'Service Advisor Workspace',eyebrow:'Repair operations',desc:'Intake, approvals, communication, scheduling, parts readiness and customer handoff in one service workflow.',cards:[['Active repair queue','Shared work-order state'],['Diagnostics & estimates','Revision + authorization history'],['Customer communication','Unified repair timeline'],['Parts readiness','Reservations and availability']],rows:[['Repair intake','Equipment, serial, complaint and condition','Intake'],['Awaiting customer decision','Estimate approvals surface here','Approval'],['Pickup readiness','Completed work ready for handoff','Handoff']],actions:['Work Orders','Diagnostics & Authorizations','Scheduling & Capacity','Customer Communication']},technician:{title:'Technician Workspace',eyebrow:'My repair day',desc:'A technician sees assigned work, time, parts and QC—not payroll management or unrelated business administration.',cards:[['My assigned jobs','Technician-scoped work'],['Time tracking','Planned vs actual hours'],['Parts control','Reserved, consumed and returned'],['Repair quality','Notes, diagnostics and QC']],rows:[['Assigned repair task','Work belonging to signed-in technician','Assigned'],['Parts requirement','Availability tied to work order','Check'],['Completion workflow','Progress, notes and QC evidence','Work']],actions:['My Work Orders','Parts Control','Equipment History','Guided Mode']},dispatch:{title:'Dispatch Workspace',eyebrow:'Routing & logistics intelligence',desc:'Dispatchers get movement control, assignment, risk, transfer coverage and chain-of-custody workflows.',cards:[['Open movements','Dispatch queue'],['At-risk jobs','Promise and assignment risk'],['Unassigned work','Needs dispatcher action'],['In transit','Live movement state']],rows:[['Branch transfer','Source → destination movement','Ready'],['Repair pickup / return','Customer equipment logistics','Schedule'],['Rental delivery / collection','Asset movement lifecycle','Dispatch']],actions:['Dispatch Command Center','Transfers','Fleet & Routing','Guided Mode']},inventory:{title:'Inventory / Warehouse Workspace',eyebrow:'Inventory intelligence',desc:'Stock integrity, replenishment, transfers, repair-parts demand and exception management centered on real inventory evidence.',cards:[['Stock integrity','Negative / inconsistent records'],['Availability','On hand vs reserved'],['Rebalancing','Transfer before purchase'],['Capital exposure','Dead / excess stock signals']],rows:[['Stockout risk','Immediate availability exception','Action'],['Branch imbalance','Potential safe transfer opportunity','Review'],['Repair parts shortage','Blocked service demand','Source']],actions:['Inventory','Inventory Intelligence','Warehouse','Smart Transfers']},finance:{title:'Finance Workspace',eyebrow:'Accounting intelligence',desc:'Operational finance, AP, settlement reconciliation and ledger controls separated from frontline POS workflows.',cards:[['Accounting ledger','Balanced, source-linked journals'],['Receivables','Customer exposure'],['Payables','Supplier invoices and aging'],['Settlements','POS vs bank / processor evidence']],rows:[['Unreconciled settlement','Recorded collection needs external evidence','Reconcile'],['Supplier payable','Posted invoice with due-date control','AP'],['Margin exception','Operational profitability signal','Review']],actions:['Accounting Intelligence','Accounting Ledger','Supplier Ledger','Settlement Reconciliation']}};const order=['management','service','technician','dispatch','inventory','finance'];function nav(){document.getElementById('nav').innerHTML=order.map((k,i)=>'<button data-role="'+k+'" class="'+(i===0?'active':'')+'">'+roles[k].title.replace(' Workspace','')+'</button>').join('');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>show(b.dataset.role));}function show(k){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===k));const r=roles[k];document.getElementById('topTitle').textContent=r.title;document.getElementById('content').innerHTML='<div class="hero"><div><span class="eyebrow">'+r.eyebrow+'</span><h1>'+r.title+'</h1><p>'+r.desc+'</p></div><span class="pill">Role-aware navigation</span></div><div class="grid">'+r.cards.map(c=>'<article class="card"><small>'+c[0]+'</small><strong>'+c[1]+'</strong><p>Integrated into the employee\'s primary workflow rather than sidelined in an upgrades area.</p></article>').join('')+'</div><div class="split"><section class="card"><div class="section-title"><div><small>Priority workspace</small><strong>What this employee needs to act on</strong></div></div><div class="queue">'+r.rows.map(x=>'<article class="row"><div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><b>'+x[2]+'</b></article>').join('')+'</div></section><aside class="card callout"><small>Guided Mode</small><strong>Filtered to this employee</strong><p>Guidance only includes workflows the signed-in employee is permitted to access. It remains non-blocking and out of the way.</p></aside></div><div class="actions">'+r.actions.map(a=>'<button>'+a+'</button>').join('')+'</div><div class="note">This fast preview shows the upgraded information architecture and role separation only. It intentionally contains no fabricated business metrics or customer records.</div>';}nav();show('management');</script></body></html>
