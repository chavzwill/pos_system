name: Runtime Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.js'
      - 'package.json'
      - 'package-lock.json'
      - 'database.js'
      - 'public/**'
      - 'routes/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/POS_INVARIANT_REGISTRY.md'
      - '.github/workflows/**'
  push:
    branches:
      - master
      - 'feature/**'
      - 'integration/**'
      - 'gate*/**'
    paths:
      - '**/*.js'
      - 'package.json'
      - 'package-lock.json'
      - 'database.js'
      - 'public/**'
      - 'routes/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/POS_INVARIANT_REGISTRY.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: runtime-certification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POS_TEST_USER: admin
      POS_TEST_PASSWORD: '123456'
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      CI: '1'
    steps:
      - name: Checkout current head
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate isolated CI encryption key
        shell: bash
        run: |
          key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64'))")"
          printf 'POS_SETTINGS_ENCRYPTION_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate Gate 0 and Gate 1 backend syntax
        run: |
          node --check lib/sessionAuth.js
          node --check lib/nextNumber.js
          node --check lib/securityHardening.js
          node --check lib/securityAudit.js
          node --check lib/retail-return-invariants.js
          node --check lib/retail-refund-invariants.js
          node --check routes/employees.js
          node --check routes/retail-return-uom-guard.js
          node --check routes/retail-sale-idempotency.js
          node --check routes/retail-checkout-hardening.js
          node --check public/pos-sale-operation-journal.js

      - name: Certify production credential bootstrap and recovery
        run: |
          node scripts/certify-production-credential-bootstrap.js
          node scripts/certify-production-account-recovery.js

      - name: Certify settings secret encryption
        run: node scripts/certify-settings-secret-encryption.js

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Bootstrap isolated local runtime database
        run: |
          rm -f pos.db pos.db-shm pos.db-wal
          node scripts/ci-runtime-bootstrap.js

      - name: Run full application release gate
        run: npm run test:release-gate -- --workers=1

      - name: Run Gate 0 credential and concurrency certification
        run: npx playwright test tests/password-reset-security.spec.js tests/forced-password-change.spec.js tests/pin-security-runtime.spec.js tests/pin-credential-boundary.spec.js tests/document-number-concurrency.spec.js --workers=1

      - name: Run Gate 1 money and inventory concurrency certification
        run: npx playwright test tests/pos-financial-runtime.js tests/gate1-return-concurrency.spec.js tests/gate1-refund-tender-concurrency.spec.js tests/gate1-sale-idempotency.spec.js tests/gate1-sale-operation-journal.spec.js --workers=1

      - name: Run privileged security and secret governance certification
        run: npx playwright test tests/security-assignment-boundaries.spec.js tests/security-governance-atomicity.spec.js tests/api-key-governance.spec.js tests/settings-security-governance.spec.js tests/settings-secret-at-rest.spec.js tests/woocommerce-secret-governance.spec.js tests/request-abuse-security.spec.js --workers=1

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-certification-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
