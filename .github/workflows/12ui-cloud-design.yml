name: 12ui Cloud Design
on:
  push:
    branches: [redesign/total-tools-frontend]
    paths: ['.github/workflows/12ui-cloud-design.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: total-tools-12ui-design
  cancel-in-progress: false
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/total-tools-frontend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install design CLI
        run: npx -y @12ui/design cli install
      - name: Run persistent cloud design session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          node scripts/cloud-design-session.cjs
