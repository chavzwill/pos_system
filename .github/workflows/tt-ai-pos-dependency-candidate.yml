name: POS dependency advisory remediation candidate

# Temporary validation of npm-regenerated files before they are committed.
on:
  pull_request:
    paths:
      - '.github/workflows/tt-ai-pos-dependency-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update pinned body-parser and independently qualify transitive fixes
        run: |
          npm install --package-lock-only --save-exact body-parser@1.20.9 --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify reproducible install from candidate lockfile
        run: npm ci --no-audit --no-fund
      - name: Require actual POS production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: POS application syntax checks
        run: npm run check:syntax
      - name: TT AI gateway security and request-boundary checks
        run: |
          node scripts/check-tt-ai-read-contract.js
          node scripts/check-tt-ai-read-runtime.js
          node scripts/check-tt-ai-assertion-contract.js
          node --test tests/tt-ai-query-bridge.spec.js
      - name: Export verified dependency files for review
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const path of ['package.json','package-lock.json']){
            console.log('TT_AI_DEPENDENCY_FILE_BEGIN:'+path);
            process.stdout.write(fs.readFileSync(path,'utf8')+'\n');
            console.log('TT_AI_DEPENDENCY_FILE_END:'+path);
          }
          NODE
