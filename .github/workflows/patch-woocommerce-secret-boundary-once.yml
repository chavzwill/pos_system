name: Patch WooCommerce secret boundary once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-woocommerce-secret-boundary-once.yml

permissions:
  contents: write

jobs:
  patch-woocommerce-secret-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Patch exact WooCommerce credential boundaries
        shell: python
        run: |
          from pathlib import Path

          settings=Path('routes/settings.js')
          s=settings.read_text()
          replacements=[
            ("  'woocommerce_consumer_key','woocommerce_consumer_secret','woocommerce_webhook_secret','stripe_secret_key','stripe_webhook_secret',",
             "  'woo_consumer_key','woo_consumer_secret','woocommerce_consumer_key','woocommerce_consumer_secret','woocommerce_webhook_secret','stripe_secret_key','stripe_webhook_secret',"),
            ("  'woo_url','woo_sync_branch_id','woo_sync_interval','woocommerce_consumer_key','woocommerce_consumer_secret','woocommerce_webhook_secret',",
             "  'woo_url','woo_consumer_key','woo_consumer_secret','woo_pos_url','woo_sync_branch_id','woo_sync_interval','woocommerce_consumer_key','woocommerce_consumer_secret','woocommerce_webhook_secret',"),
            ("  'wo_assessment_fee','woo_sync_interval',",
             "  'wo_assessment_fee','woo_url','woo_consumer_key','woo_consumer_secret','woo_pos_url','woo_sync_branch_id','woo_sync_interval',"),
          ]
          for old,new in replacements:
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'Expected one settings credential anchor, found {count}: {old[:80]}')
            s=s.replace(old,new)
          settings.write_text(s)

          woo=Path('routes/woocommerce.js')
          w=woo.read_text()
          import_anchor="const { requirePermission } = require('../lib/permissions');\n"
          helper="""const { requirePermission } = require('../lib/permissions');\n\nfunction redactWcConfigValue(key, value) {\n  return ['woo_consumer_key','woo_consumer_secret'].includes(key) && value ? '••••••••' : value;\n}\n"""
          if w.count(import_anchor) != 1:
            raise SystemExit(f'Expected one WooCommerce permission import, found {w.count(import_anchor)}')
          w=w.replace(import_anchor,helper)
          old_guard="router.use(requirePermission('settings'));"
          new_guard="router.use(requirePermission('settings_integrations'));"
          if w.count(old_guard) != 1:
            raise SystemExit(f'Expected one broad WooCommerce settings guard, found {w.count(old_guard)}')
          w=w.replace(old_guard,new_guard)
          old_config="rows.forEach(r => { config[r.key] = r.value; });"
          new_config="rows.forEach(r => { config[r.key] = redactWcConfigValue(r.key, r.value); });"
          if w.count(old_config) != 1:
            raise SystemExit(f'Expected one raw WooCommerce config projection, found {w.count(old_config)}')
          w=w.replace(old_config,new_config)
          woo.write_text(w)
      - name: Verify narrow security patch
        run: |
          node --check routes/settings.js
          node --check routes/woocommerce.js
          grep -F "'woo_consumer_key','woo_consumer_secret'" routes/settings.js
          grep -F "router.use(requirePermission('settings_integrations'))" routes/woocommerce.js
          grep -F "redactWcConfigValue" routes/woocommerce.js
          git diff --check
          git diff -- routes/settings.js routes/woocommerce.js
      - name: Commit WooCommerce secret boundary hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/settings.js routes/woocommerce.js
          git commit -m "Protect live WooCommerce credentials"
          git push origin HEAD:security/pos-hardening-v1
