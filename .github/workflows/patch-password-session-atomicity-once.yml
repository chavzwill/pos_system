name: Patch password session atomicity once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-password-session-atomicity-once.yml

permissions:
  contents: write

jobs:
  patch-password-session-atomicity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Move session revocation inside credential transactions
        shell: python
        run: |
          from pathlib import Path
          path=Path('routes/employees.js')
          source=path.read_text()

          replacements=[
            (
              "      await tx.execute({ sql: 'UPDATE employees SET password=?,must_change_password=0 WHERE id=?', args: [hash, targetId] });\n      await recordSecurityAudit({",
              "      await tx.execute({ sql: 'UPDATE employees SET password=?,must_change_password=0 WHERE id=?', args: [hash, targetId] });\n      await destroyEmployeeSessions(targetId, tx);\n      await recordSecurityAudit({",
            ),
            (
              "      await tx.execute({ sql: 'UPDATE employees SET password=?,must_change_password=1 WHERE id=?', args: [hash, targetId] });\n      await recordSecurityAudit({",
              "      await tx.execute({ sql: 'UPDATE employees SET password=?,must_change_password=1 WHERE id=?', args: [hash, targetId] });\n      await destroyEmployeeSessions(targetId, tx);\n      await recordSecurityAudit({",
            ),
            (
              "    await destroyEmployeeSessions(targetId);\n    clearSessionCookie(res);",
              "    clearSessionCookie(res);",
            ),
            (
              "    await destroyEmployeeSessions(targetId);\n    res.json({ success: true, must_change_password: true, sessions_revoked: true });",
              "    res.json({ success: true, must_change_password: true, sessions_revoked: true });",
            ),
          ]
          for old,new in replacements:
            count=source.count(old)
            if count != 1:
              raise SystemExit(f'Expected one exact credential-session boundary, found {count}: {old[:80]}')
            source=source.replace(old,new)
          path.write_text(source)
      - name: Verify atomic route patch
        run: |
          node --check routes/employees.js
          test "$(grep -c 'destroyEmployeeSessions(targetId, tx)' routes/employees.js)" -eq 2
          git diff --check
          git diff -- routes/employees.js
      - name: Commit atomic credential lifecycle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/employees.js
          git commit -m "Make credential session revocation atomic"
          git push origin HEAD:security/pos-hardening-v1
