name: Dependency Security Refresh

on:
  push:
    branches:
      - security/multer-2.2.0
    paths:
      - package.json
      - .github/workflows/dependency-security-refresh.yml

permissions:
  contents: write

concurrency:
  group: dependency-security-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-audit-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POS_TEST_USER: admin
      POS_TEST_PASSWORD: '123456'
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      CI: '1'
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted security dependency updates
        run: |
          npm install express@4.22.2 multer@2.2.0 nodemailer@9.0.1 body-parser@1.20.6 --save-exact --package-lock-only --ignore-scripts
          npm update qs --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Require zero production dependency vulnerabilities
        run: npm audit --omit=dev

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Bootstrap isolated local runtime database
        run: |
          rm -f pos.db pos.db-shm pos.db-wal
          node scripts/ci-runtime-bootstrap.js

      - name: Run full release gate
        run: npm run test:release-gate -- --workers=1

      - name: Commit dependency files after successful audit and certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
          else
            git commit -m "Reach zero production dependency audit findings"
            git push
          fi

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-refresh-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
