name: Patch qs advisory once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-qs-advisory-once.yml

permissions:
  contents: write

jobs:
  patch-qs-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin patched qs and refresh lockfile
        run: |
          npm pkg set overrides.qs=6.15.4
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
      - name: Verify dependency-only change
        run: |
          node -e "const p=require('./package.json'); if(p.overrides?.qs!=='6.15.4') process.exit(1)"
          npm ls qs
          git diff --check
          git diff -- package.json package-lock.json
      - name: Commit patched dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch qs dependency advisories"
          git push origin HEAD:security/pos-hardening-v1
