name: Stock Finder RED Probe
on:
  pull_request:
    branches:
      - integration/pos-consolidated-2026-09-07
    paths:
      - 'scripts/check-stock-finder-contract.js'
      - '.github/workflows/stock-finder-red.yml'
jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-stock-finder-contract.js
