name: Patch email document RBAC once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/patch-email-document-rbac-once.yml

permissions:
  contents: write

jobs:
  patch-email-document-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0
      - name: Bind document email actions to owning permissions
        shell: python
        run: |
          from pathlib import Path
          p=Path('routes/email.js')
          s=p.read_text()
          replacements={
            "router.post('/send-receipt/:id', requireAuth, async (req, res) => {":"router.post('/send-receipt/:id', requirePermission('transactions'), async (req, res) => {",
            "router.post('/send-void-receipt/:id', requireAuth, async (req, res) => {":"router.post('/send-void-receipt/:id', requirePermission('transactions'), async (req, res) => {",
            "router.post('/send-return-receipt/:id', requireAuth, async (req, res) => {":"router.post('/send-return-receipt/:id', requirePermission('transactions_returns'), async (req, res) => {",
            "router.post('/send-cancellation-receipt/:id', requireAuth, async (req, res) => {":"router.post('/send-cancellation-receipt/:id', requirePermission('rentals'), async (req, res) => {",
            "router.post('/send-quote/:id', requireAuth, async (req, res) => {":"router.post('/send-quote/:id', requirePermission('quotations'), async (req, res) => {",
            "router.post('/send-grn/:id', requireAuth, async (req, res) => {":"router.post('/send-grn/:id', requirePermission('purchasing_receive'), async (req, res) => {",
            "router.get('/statement-preview/:customer_id', requireAuth, async (req, res) => {":"router.get('/statement-preview/:customer_id', requirePermission('accounts'), async (req, res) => {",
            "router.post('/send-statement/:customer_id', requireAuth, async (req, res) => {":"router.post('/send-statement/:customer_id', requirePermission('accounts'), async (req, res) => {",
            "router.post('/test', requirePermission('settings'), async (req, res) => {":"router.post('/test', requirePermission('settings_integrations'), async (req, res) => {",
            "router.post('/send-work-order-ready/:id', requireAuth, async (req, res) => {":"router.post('/send-work-order-ready/:id', requirePermission('work_orders'), async (req, res) => {",
          }
          for old,new in replacements.items():
            count=s.count(old)
            if count!=1: raise SystemExit(f'Expected one email route boundary, found {count}: {old}')
            s=s.replace(old,new)
          p.write_text(s)
      - name: Verify email RBAC patch
        run: |
          node --check routes/email.js
          ! grep -F "router.post('/test', requirePermission('settings')" routes/email.js
          ! grep -E "router\.(post|get)\('/(send-receipt|send-void-receipt|send-return-receipt|send-cancellation-receipt|send-quote|send-grn|statement-preview|send-statement|send-work-order-ready).*requireAuth" routes/email.js
          grep -F "router.post('/test', requirePermission('settings_integrations')" routes/email.js
          git diff --check
          git diff -- routes/email.js
      - name: Commit email document authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/email.js
          git commit -m "Bind email documents to business permissions"
          git push origin HEAD:security/pos-hardening-v1
