name: Remove legacy bootstrap credentials once

on:
  push:
    branches:
      - security/pos-hardening-v1
    paths:
      - .github/workflows/remove-legacy-bootstrap-credentials-once.yml

permissions:
  contents: write

jobs:
  patch-legacy-credential-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardened branch
        uses: actions/checkout@v4
        with:
          ref: security/pos-hardening-v1
          fetch-depth: 0

      - name: Remove known bootstrap credentials
        shell: python
        run: |
          from pathlib import Path

          path = Path('database.js')
          source = path.read_text()

          repair = '''  // Ensure admin always has a password — runs unconditionally on every boot
          {
            const { rows: [adminEmp] } = await db.execute({ sql: 'SELECT id, password FROM employees WHERE username = ?', args: ['admin'] });
            if (adminEmp && !adminEmp.password) {
              await db.execute({ sql: "UPDATE employees SET password='123456', must_change_password=1 WHERE username='admin'", args: [] });
            }
          }

          '''
          if source.count(repair) != 1:
              raise SystemExit(f'Expected exactly one legacy admin repair block, found {source.count(repair)}')
          source = source.replace(repair, '''  // Credentials are never manufactured during database initialization. A fresh
          // installation remains locked until the explicit production credential
          // preflight provisions the administrator, or a test/dev bootstrap does so.

          ''')

          seed = '''    // Employees — admin seeded with default password so first login works immediately
              const eSql = 'INSERT INTO employees (employee_number,first_name,last_name,username,pin,password,must_change_password,role) VALUES (?,?,?,?,?,?,?,?)';
              await db.execute({ sql: eSql, args: ['EMP-0001','Admin','User','admin','1234','123456',1,'admin'] });
              await db.execute({ sql: eSql, args: ['EMP-0002','Jane','Doe','jdoe','5678',null,0,'cashier'] });
              await db.execute({ sql: eSql, args: ['EMP-0003','Bob','Smith','bsmith','9012',null,0,'cashier'] });
          '''
          if source.count(seed) != 1:
              raise SystemExit(f'Expected exactly one legacy employee credential seed block, found {source.count(seed)}')
          source = source.replace(seed, '''    // Fresh/demo identities are deliberately credential-locked. !LOCKED! is not a
              // syntactically valid PIN and cannot authenticate through routes/employees.js.
              // Production must provision the administrator through the credential preflight;
              // CI/dev bootstraps may replace these locked values with bcrypt hashes explicitly.
              const eSql = 'INSERT INTO employees (employee_number,first_name,last_name,username,pin,password,must_change_password,role) VALUES (?,?,?,?,?,?,?,?)';
              const lockedCredential = '!LOCKED!';
              await db.execute({ sql: eSql, args: ['EMP-0001','Admin','User','admin',lockedCredential,null,1,'admin'] });
              await db.execute({ sql: eSql, args: ['EMP-0002','Jane','Doe','jdoe',lockedCredential,null,1,'cashier'] });
              await db.execute({ sql: eSql, args: ['EMP-0003','Bob','Smith','bsmith',lockedCredential,null,1,'cashier'] });
          ''')

          path.write_text(source)

      - name: Verify patch is narrowly scoped
        run: |
          node --check database.js
          ! grep -F "password='123456'" database.js
          ! grep -F "'admin','1234','123456'" database.js
          git diff --check
          git diff -- database.js

      - name: Commit credential seed hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.js
          git commit -m "Remove legacy plaintext bootstrap credentials"
          git push origin HEAD:security/pos-hardening-v1
